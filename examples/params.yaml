transit:
  t0: 0.0 # time of inferior conjunction
  per: 2.152175 # orbital period in days
  rp: 0.12831 # planet radius (in the units of Star's radius)
  a: 7.81 # semi-major axis (in the units of Star's radius)
  inc: 84.49 # orbital inclination (in degrees)
  ecc: 0.0 # eccentricity
  w: 90.0 # longitude of periastron (in degrees)
  u: [0.425, 0.179] # limb darkening coefficients [u1, u2]
  limb_dark: "quadratic" # limb darkening model
classifier:
  type: cnn # [cnn, rf] for Convolutional Neural Network and Random Forest